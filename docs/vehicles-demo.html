<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seamline vehicles</title>
<style>
  html,body{margin:0;height:100%;background:#9fb4c4;font:14px system-ui,sans-serif;overflow:hidden}
  #hud{position:absolute;top:12px;left:12px;background:rgba(20,26,32,.82);color:#fff;padding:10px 12px;border-radius:8px;line-height:1.5}
  #hud button{font:inherit;margin-right:6px;padding:4px 10px;border-radius:6px;border:1px solid #fff4;background:#fff1;color:#fff;cursor:pointer}
  #hud button.on{background:#fff;color:#111}
</style></head><body>
<div id="hud"><b>Seamline work vehicles</b><br>
  <button data-l="detailed">Detailed</button><button data-l="ultra">Ultra-realistic</button><button data-l="both">Both</button><br>
  <span id="stats"></span></div>
<script src="../vendor/three.min.js"></script>
<script src="../vendor/OrbitControls.js"></script>
<script src="../vendor/three-extras.js"></script>
<script src="../src/vehicles3d.js"></script>
<script>
const T = THREE, q = new URLSearchParams(location.search);
const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.55;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new T.Scene();
// sky as background and environment light, like the pair view
const sky = new T.Sky(); sky.scale.setScalar(4000);
const sun = new T.Vector3(0.55, 0.52, 0.35).normalize(), u = sky.material.uniforms;
u.turbidity.value = 4.5; u.rayleigh.value = 2; u.mieCoefficient.value = 0.004; u.mieDirectionalG.value = 0.82; u.sunPosition.value.copy(sun);
const envScene = new T.Scene(); envScene.add(sky);
const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene).texture;
scene.add(sky.clone());
const light = new T.DirectionalLight(0xfff1d6, 2.6); light.position.copy(sun).multiplyScalar(80); light.castShadow = true;
Object.assign(light.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, far: 250 }); light.shadow.mapSize.set(4096, 4096); light.shadow.bias = -0.0004;
const hemi = new T.HemisphereLight(0xdde8f2, 0x46584c, 0.2);
[light, hemi].forEach(l => l.color.convertSRGBToLinear()); hemi.groundColor.convertSRGBToLinear();
scene.add(light, hemi);
// colors are written as sRGB hex; the pair view linearizes them the same way after building its scene
const ground = new T.Mesh(new T.PlaneGeometry(400, 400), new T.MeshStandardMaterial({ color: new T.Color(0x8d8a7e).convertSRGBToLinear(), roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new T.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 5000);
const controls = new T.OrbitControls(camera, renderer.domElement);
const cam = (q.get("cam") || "26,16,42,0,4,0").split(",").map(Number);
camera.position.set(cam[0], cam[1], cam[2]); controls.target.set(cam[3], cam[4], cam[5]); controls.update();
// layout: rows of vehicles; x along the row, rows in z
const ROW = [["pickup", -16, 12], ["bucket", -5, 12], ["truckCrane", 12, 12], ["flatbed", -6, -2], ["lowboy", 18, -4], ["crawlerCrane", -4, -20]];
let group = null;
function show(which) {
  if (group) { scene.remove(group); group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
  group = new T.Group(); scene.add(group);
  const levels = which === "both" ? ["detailed", "ultra"] : [which];
  let tris = 0, calls = 0;
  levels.forEach((lv, li) => ROW.forEach(([kind, x, z]) => {
    const v = Vehicles3D.build(T, kind, { level: lv });
    v.position.set(x, 0, z + (levels.length > 1 ? (li ? -30 : 0) : 0)); v.rotation.y = -0.2;
    v.traverse(o => o.material && (o.material.color.convertSRGBToLinear(), o.material.emissive && o.material.emissive.convertSRGBToLinear()));
    group.add(v); tris += v.userData.tris; calls += v.children.length;
  }));
  document.getElementById("stats").textContent = `${levels.join(" + ")}: ${Math.round(tris / 1000)}k triangles, ${calls} draw calls`;
  document.querySelectorAll("#hud button").forEach(b => b.classList.toggle("on", b.dataset.l === which));
}
document.querySelectorAll("#hud button").forEach(b => b.onclick = () => show(b.dataset.l));
show(q.get("level") || "detailed");
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script></body></html>
